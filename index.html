<body>
<div class=top><div class=t><b id=ttl>WONDER Mobile</b><div class=s id=sub></div></div><span id=tact></span><button id=hb style="display:none">⌂</button></div>
<div class=wrap id=app></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzl13KzBGmSsTvoE_o-jtevudsTVAdV5VyKa6sNtb4WzulJ-iy4X30opOmxB0pW6Y7ApQ/exec';let SHOP=localStorage.getItem('wm_shop')||'';const JOIN=(new URLSearchParams(location.search).get('j')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();let TOK='',ME=null,ITEMS=null,PARTIES=null,CT='',M=null,IT=[],Q={},SV={},COPS={},DIRTY={},CLR=new Set(),TAB='list',busy=false,lastSave=0,QT=null;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),U=s=>String(s||'').trim().toUpperCase(),dmy=d=>String(d||'').split('-').reverse().join('-'),f2=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
function toast(t,ms){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(_){return null}}
async function run(fn,...a){let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({mrun:fn,args:a})})}catch(e){throw new Error('No internet – try again')}let j;try{j=await r.json()}catch(e){throw new Error('Shop server did not answer – try again')}if(!j.ok)throw new Error(j.err||'Error');return j.res}
async function call(fn,...a){try{return await run(fn,TOK,...a)}catch(e){if(/log in again/i.test(e.message)){TOK='';ls('wm_tok',null);login(e.message);throw new Error('stop')}throw e}}
function hb(show){$('#hb').style.display=show?'':'none';$('#tact').innerHTML=''}
/* back button = one screen back (Deepak 27-Nov) */
let NAVS=[];function nav(fn){camStop();NAVS.push(fn);history.pushState({n:NAVS.length},'');fn()}
async function leaving(){if(CT&&(Object.keys(DIRTY).length||CLR.size))await save(false)}
window.addEventListener('popstate',async e=>{if(OVSKIP){OVSKIP--;return}const o=[...document.querySelectorAll('.done:not(.it)')].pop();if(o){o.remove();return}
 if(e.state&&e.state.root){if(NAVS.length||CT){await leaving();camStop();NAVS=[];history.pushState({home:1},'');home(true);return}
  if(confirm('Close WONDER Mobile?')){try{window.close()}catch(_){}setTimeout(()=>{history.back();toast('Press back once more to close')},250)}else history.pushState({home:1},'');return}
 await leaving();camStop();NAVS.pop();const f=NAVS[NAVS.length-1];if(f)f();else home(true)});
/* a "home" entry above the first one, so the phone back key never closes the app by surprise */
(function(){const g=()=>{if(!(history.state&&(history.state.home||history.state.n||history.state.ov))){history.replaceState({root:1},'');history.pushState({home:1},'')}};document.addEventListener('pointerdown',g,{once:true,capture:true})})();
async function goHome(){await leaving();const n=NAVS.length;NAVS=[];if(n)history.go(-n);else home(true)}
$('#hb').onclick=()=>goHome();
/* ---------- login / PIN ---------- */
function login(msg,pre){hb(0);$('#ttl').textContent='WONDER Mobile';$('#sub').textContent=SHOP;const u=(pre&&pre.u)||ls('wm_user')||'';
 $('#app').innerHTML=`<div class=card><h3 style="margin-top:0">Log in</h3><label class=l>User name (same as WONDER)</label><input id=lu value="${esc(u)}" autocomplete=username autocapitalize=none>
  <label class=l>PIN</label><input id=lp type=password inputmode=numeric maxlength=6 placeholder="••••" autocomplete=current-password><div style="height:12px"></div>
  <button class="btn w" id=lgo>Log in</button><div class=err id=le>${esc(msg||'')}</div><div style="height:12px"></div><span class=lnk id=lfirst>First time / Forgot PIN →</span></div>
  <div class=card><p class=note style="margin:0">Tip: Chrome menu ⋮ → <b>Install app</b> (or Add to Home screen) – then WONDER Mobile opens like an app with its own icon.</p></div>`;
 const go=async()=>{const user=$('#lu').value.trim(),pin=$('#lp').value.trim();if(!user)return $('#le').textContent='Write your user name';if(!/^\d{4,6}$/.test(pin))return $('#le').textContent='PIN is 4–6 digits';
  $('#lgo').disabled=true;$('#le').textContent='';try{const r=await run('mLogin',user,pin);TOK=r.tok;ls('wm_tok',TOK);ls('wm_user',user);home()}catch(e){$('#lgo').disabled=false;$('#le').textContent=e.message}};
 $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key=='Enter')go()};$('#lfirst').onclick=()=>setPin('',{u:$('#lu').value.trim()});(u?$('#lp'):$('#lu')).focus()}
function setPin(msg,pre){hb(0);const u=(pre&&pre.u)||'',c=(pre&&pre.c)||'';
 $('#app').innerHTML=`<div class=card><h3 style="margin-top:0">Set your PIN</h3><p class=note>Use the <b>setup code</b> from the shop (it works once). Choose your own 4–6 digit PIN – nobody else sees it.</p>
  <label class=l>User name</label><input id=su value="${esc(u)}" autocapitalize=none><label class=l>Setup code</label><input id=sc value="${esc(c)}" autocapitalize=characters placeholder="e.g. K7M2QX">
  <label class=l>New PIN</label><input id=sp1 type=password inputmode=numeric maxlength=6><label class=l>New PIN again</label><input id=sp2 type=password inputmode=numeric maxlength=6>
  <div style="height:12px"></div><button class="btn w" id=sgo>Save PIN &amp; log in</button><div class=err id=se>${esc(msg||'')}</div>
  <div style="height:14px"></div><span class=lnk id=sask>No setup code? Ask the shop for one</span> &nbsp; <span class=lnk id=sback>← Back</span></div>`;
 $('#sgo').onclick=async()=>{const user=$('#su').value.trim(),code=$('#sc').value.trim(),p1=$('#sp1').value.trim(),p2=$('#sp2').value.trim();
  if(!user||!code)return $('#se').textContent='Write user name and setup code';if(!/^\d{4,6}$/.test(p1))return $('#se').textContent='PIN must be 4–6 digits';if(p1!==p2)return $('#se').textContent='The two PINs are not the same';
  $('#sgo').disabled=true;try{const r=await run('mSetPin',user,code,p1);TOK=r.tok;ls('wm_tok',TOK);ls('wm_user',user);toast('✔ PIN saved');home()}catch(e){$('#sgo').disabled=false;$('#se').textContent=e.message}};
 $('#sask').onclick=async()=>{const user=$('#su').value.trim();if(!user)return $('#se').textContent='Write your user name first';try{await run('mForgot',user);$('#se').innerHTML='<span class=ok>✔ Request sent – the shop will give you a new setup code.</span>'}catch(e){$('#se').textContent=e.message}};
 $('#sback').onclick=()=>login();}
/* ---------- home ---------- */
async function home(keep){document.body.classList.remove('gnon');gvStop();const RO=home.done?null:sessionStorage.getItem('wm_open');home.done=1;sessionStorage.removeItem('wm_open');camStop();if(!keep&&NAVS.length){NAVS=[]}CT='';M=null;QT=null;hb(0);$('#ttl').textContent='WONDER Mobile';$('#app').innerHTML='<div class=card><p class=note>Loading…</p></div>';
 try{ME=await call('mHome')}catch(e){if(e.message!='stop')$('#app').innerHTML='<div class=card><b class=err>'+esc(e.message)+'</b><div style="height:10px"></div><button class="btn ghost" onclick="home()">Try again</button></div>';return}
 $('#sub').textContent='Hello '+ME.name+' · '+SHOP;if(RO&&lGet().some(x=>x.id==RO))setTimeout(()=>{nav(lists);nav(()=>listOpen(RO))},60);setTimeout(()=>{if(!ITF)itemsFresh().catch(()=>{})},600);const F=ME.flags||{},open=ME.counts.filter(c=>c.status=='open').length,sent=(ls('wm_q_'+U(ME.name))||[]);
 $('#app').innerHTML=`<div class=tiles>${F.count?`<div class=tile id=tc><div class=i>📦</div>Stock count<div class=n>${open?open+' to count':'nothing to count'}</div></div>`:''}
  ${F.count?`<div class=tile id=tl><div class=i>📋</div>My scan lists<div class=n>${(ls('wm_lists_'+U(ME.name))||[]).length} on this phone</div></div>`:''}
  ${F.quote?`<div class=tile id=tq><div class=i>📝</div>New quotation<div class=n>${sent.length?sent.length+' sent':'send to the shop'}</div></div>`:''}
  ${F.gstock?`<div class=tile id=tsi><div class=i>📥</div>Stock aaya<div class=n>photo of bill / parchi</div></div>`:''}
  <div class="tile gt" id=tg><span class="gorb br"></span>Ask Genie<div class=n>AI assistant</div></div>
  <div class=tile id=ti><div class=i>🔍</div>Items<div class=n>${F.rate||F.stock?'rates'+(F.stock?' & stock':''):'name & code'}</div></div>
  <div class=tile id=tp><div class=i>🔑</div>Change PIN<div class=n>or log out</div></div>${canAppr()?`<div class=tile id=tap><div class=i>✅</div>Approvals<div class=n>${ME.pend?'<b style="color:#c0392b">'+ME.pend+' waiting</b>':'nothing waiting'}</div></div>`:''}${ME.adm?`<div class=tile id=tau><div class=i>👥</div>Users &amp; PIN<div class=n>rights · PIN · new user</div></div>`:''}</div>
  ${F.quote&&sent.length?`<div class=card style="margin-top:12px"><b>Quotations sent from this phone</b>${sent.slice(-10).reverse().map(q=>`<div class=it><div class=nm><b>${esc(q.party||q.phone)}</b><span>${esc(q.id)} · ${esc(q.at)} · ${q.n} items${q.t?' · ₹'+f2(q.t):''}</span></div></div>`).join('')}</div>`:''}
  ${ME.mc?`<div class=card style="margin-top:12px;background:#fff7e6;border:1px solid #e0a84a"><b>🔑 Your PIN is still 1234</b><p class=note style="margin:6px 0">Everybody knows 1234. Make your own PIN – takes 10 seconds.</p><button class="btn" id=mcp>Make my PIN</button></div>`:''}
  <div class=card style="margin-top:12px;display:flex;gap:8px;align-items:center"><span class=note style="flex:1">Version ${APP_V}</span><button class="btn ghost" id=hup>⟳ Update</button><button class="btn ghost" id=hset>⚙</button></div>
  ${!F.count&&!F.quote?'<p class=note style="margin-top:12px">The shop has not given you stock count or quotation yet.</p>':''}`;
 $('#hup').onclick=()=>upCheck(true);$('#hset').onclick=()=>nav(scanSettings);$('#tc')&&($('#tc').onclick=()=>nav(counts));$('#tl')&&($('#tl').onclick=()=>nav(lists));$('#tq')&&($('#tq').onclick=()=>nav(()=>quote()));$('#ti').onclick=()=>nav(items);$('#tg').onclick=()=>nav(genie);$('#tsi')&&($('#tsi').onclick=()=>nav(stockIn));$('#tp').onclick=()=>nav(pinMenu);$('#tau')&&($('#tau').onclick=()=>nav(admUsers));$('#tap')&&($('#tap').onclick=()=>nav(approvals));$('#mcp')&&($('#mcp').onclick=()=>{nav(pinMenu);$('#o1').value='1234';$('#o2').focus()})}
function IK(){return 'wm_items_'+U(ME&&ME.name||'')}let ITF=null,OFFI=[];
/* deactivated items (28-Nov): WONDER sends them with group '⏻ …' – kept apart in OFFI (hidden from lists, scan still finds them) */
function itSplit(r){OFFI=[];const A=[];(r||[]).forEach(i=>{const g=String(i.g||'');if(i.o||g.charAt(0)=='⏻'){i.o=1;i.g=g.replace(/^⏻\s*/,'');OFFI.push(i)}else A.push(i)});return A}
function itCache(){try{ls(IK(),{at:Date.now(),r:(ITEMS||[]).concat(OFFI).map(i=>{const o={};Object.keys(i).forEach(k=>{if(k.charAt(0)!='_'&&k!='o')o[k]=i[k]});o.g=(i.o?'⏻ ':'')+(i.g||'');return o})})}catch(_){}}
function itemsFresh(){if(!ITF)ITF=call('mItems').then(r=>{ls(IK(),{at:Date.now(),r});ITEMS=itSplit(r);return ITEMS}).catch(e=>{ITF=null;throw e});return ITF}
async function loadItems(){if(ITEMS)return ITEMS;const c=ls(IK());if(c&&c.r&&c.r.length){ITEMS=itSplit(c.r);itemsFresh().catch(()=>{});return ITEMS}$('#app').innerHTML='<div class=card><p class=note>Loading items… (only the first time)</p></div>';return await itemsFresh()}
function pinMenu(){hb(1);$('#ttl').textContent='Change PIN';$('#app').innerHTML=`<div class=card><label class=l>Old PIN</label><input id=o1 type=password inputmode=numeric maxlength=6><label class=l>New PIN</label><input id=o2 type=password inputmode=numeric maxlength=6><label class=l>New PIN again</label><input id=o3 type=password inputmode=numeric maxlength=6>
 <div style="height:12px"></div><button class="btn w" id=ogo>Change PIN</button><div class=err id=oe></div></div><div class=card><button class="btn ghost w" id=lo>Log out from this phone</button></div>`;
 $('#ogo').onclick=async()=>{const a=$('#o1').value.trim(),b=$('#o2').value.trim();if(b!==$('#o3').value.trim())return $('#oe').textContent='The two new PINs are not the same';try{await call('mChangePin',a,b);toast('✔ PIN changed');home()}catch(e){if(e.message!='stop')$('#oe').textContent=e.message}};
 $('#lo').onclick=async()=>{try{await run('mLogout',TOK)}catch(_){}TOK='';ls('wm_tok',null);ITEMS=null;ITF=null;login('Logged out')}}
/* ---------- 👥 Users & PIN (admin only, 28-Nov V29): same as WONDER › WONDER Mobile users – on/off, rights, PIN = 1234, give app, new user.
   Changes work at once on the phones; WONDER PC applies them at its next read (Audit Trail). ---------- */
const MOBF=[['count','Stock count'],['quote','Quotation'],['stock','Show stock'],['rate','Show rate / MRP'],['value','Show stock value'],['gteach','Teach Genie'],['gstock','Stock In (photo)'],['newitem','Add new items (phone)'],['edititem','Edit items (phone)'],['approve','Approve lists (phone)']];
let ADM=null;
async function admUsers(){hb(1);$('#ttl').textContent='👥 Users & PIN';$('#app').innerHTML='<div class=card><p class=note>Loading users…</p></div>';
 try{ADM=await call('mAdmUsers')}catch(e){if(e.message!='stop')$('#app').innerHTML='<div class=card><b class=err>'+esc(e.message)+'</b></div>';return}
 const L=ADM.users.slice().sort((a,b)=>(b.adm-a.adm)||(b.on-a.on)||String(a.u).localeCompare(String(b.u))),fg=L.filter(x=>x.forgot);
 $('#app').innerHTML=`${fg.length?`<div class=card style="background:#fdecea;border:1px solid #f3b4ae"><b>🔑 Forgot PIN: ${fg.map(x=>esc(x.u)).join(', ')}</b><p class=note style="margin:4px 0 0">Open the user → <b>PIN = 1234</b>.</p></div>`:''}
  <div class=card><div class=row><input id=aq placeholder="Search user" autocomplete=off><button class="btn" id=anew>＋ New user</button></div><div id=al></div></div>
  <p class=note style="margin:8px 4px">Same list as WONDER › WONDER Mobile users. A change here works on the phone at once and WONDER PC takes it in its next read (≈2 min) – written in Audit Trail.</p>`;
 const st=x=>!x.on?'Off':x.forgot?'<b class=err>Forgot PIN</b>':x.pin?(x.mc?'PIN 1234 (not changed yet)':'✔ Own PIN set'):'No PIN yet';
 const draw=()=>{const q=U($('#aq').value);$('#al').innerHTML=L.filter(x=>!q||U(x.u+' '+x.role).includes(q)).map(x=>`<div class=it data-u="${esc(x.u)}" style="cursor:pointer"><div class=nm><b>${esc(x.u)}${x.adm?' · Admin':''}</b><span>${esc(x.role||'')}${x.role?' · ':''}${st(x)}${x.on&&x.last?' · last '+esc(dmy(String(x.last).slice(0,10))):''}${x.pcOff?' · PC login off':''}</span></div><span class=pill style="color:${x.on?'#0f766e':'#888'};background:${x.on?'#e3f3f1':'#eee'}">${x.on?'On':'Off'}</span></div>`).join('')||'<p class=note>No user</p>'};
 $('#aq').oninput=draw;$('#al').onclick=e=>{const r=e.target.closest('[data-u]');if(r)nav(()=>admOne(r.dataset.u))};$('#anew').onclick=()=>nav(admNew);draw()}
function admFlagsHtml(f,lock){return MOBF.map(([k,l])=>`<label style="display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid #eef2f1;font-size:15px"><input type=checkbox data-f=${k} ${lock||(f||{})[k]?'checked':''} ${lock?'disabled':''} style="width:22px;height:22px"> ${l}</label>`).join('')}
function admRead(){const f={};document.querySelectorAll('[data-f]').forEach(c=>{if(c.checked)f[c.dataset.f]=1});return f}
function admOne(u){const x=(ADM&&ADM.users||[]).find(v=>v.u==u);if(!x)return admUsers();hb(1);$('#ttl').textContent='👤 '+x.u;const me=U(x.u)==U(ME.name);
 $('#app').innerHTML=`<div class=card><b style="font-size:17px">${esc(x.u)}</b><div class=note>${esc(x.role||'')}${x.adm?' · Admin – all rights':''}${x.pcOff?' · PC login off (set password in WONDER › Setup › Users)':''}</div>
   <label style="display:flex;gap:10px;align-items:center;padding:12px 2px;font-size:16px;font-weight:600"><input type=checkbox id=aon ${x.on?'checked':''} ${x.adm||me?'disabled':''} style="width:24px;height:24px"> WONDER Mobile On</label>
   <div id=afl style="${x.on?'':'opacity:.45'}">${admFlagsHtml(x.flags,x.adm)}</div><div style="height:12px"></div>
   <button class="btn w" id=asv>Save</button><div class=err id=ae></div></div>
  ${x.on?`<div class=card><div class=row style="gap:8px"><button class="btn ghost" id=ap1>🔑 PIN = 1234</button><button class="btn ghost" id=agv>📲 Give app</button></div><p class=note style="margin:6px 0 0">PIN = 1234 logs the user out of every phone; they log in again with 1234 and make their own PIN.</p></div>`:''}`;
 $('#aon').onchange=()=>{$('#afl').style.opacity=$('#aon').checked?'':'.45'};
 const go=async(o,msg)=>{$('#ae').textContent='';document.querySelectorAll('#app button').forEach(b=>b.disabled=true);try{const r=await call('mAdmSet',{user:x.u,...o});toast(msg||'✔ Saved',2500);
   if(r&&r.fresh){ADM=await call('mAdmUsers');return admGive(x.u,true)}history.back()}catch(e){document.querySelectorAll('#app button').forEach(b=>b.disabled=false);if(e.message!='stop')$('#ae').textContent=e.message}};
 $('#asv').onclick=()=>{const on=$('#aon').checked;if(!on&&x.on&&!confirm('Switch WONDER Mobile OFF for '+x.u+'? They are logged out at once.'))return;go(on?{on:true,flags:admRead()}:{on:false},on?'✔ Saved':'✔ '+x.u+' is Off')};
 $('#ap1')&&($('#ap1').onclick=()=>{if(confirm('Set PIN of '+x.u+' back to 1234? Their phones are logged out.'))go({on:true,flags:x.adm?{}:x.flags,reset:true},'✔ PIN of '+x.u+' is 1234')});
 $('#agv')&&($('#agv').onclick=()=>admGive(x.u))}
function admMsg(u,p1234){return 'WONDER Mobile – '+(SHOP||'shop')+'\n'+location.origin+location.pathname+'\nUser: '+u+'\nPIN: '+(p1234?'1234 (make your own PIN after login)':'your own PIN')+'\nOpen in Chrome → ⋮ → Install app.'}
function admGive(u,fresh){const x=(ADM&&ADM.users||[]).find(v=>v.u==u)||{u:u,mc:1},msg=admMsg(u,fresh||x.mc||!x.pin);hb(1);$('#ttl').textContent='📲 Give app';
 $('#app').innerHTML=`<div class=card>${fresh?'<b class=ok>✔ '+esc(u)+' can log in now with PIN 1234</b><div style="height:8px"></div>':''}<pre style="white-space:pre-wrap;background:#f6f8f7;padding:10px;border-radius:8px;font-size:14px;margin:0">${esc(msg)}</pre>
  <label class=l>Staff WhatsApp number (10 digits)</label><input id=gph inputmode=numeric maxlength=14 placeholder="10-digit mobile"><div style="height:10px"></div>
  <div class=row style="gap:8px;flex-wrap:wrap"><button class="btn" id=gwa>Send on WhatsApp</button><button class="btn ghost" id=gsh>Share…</button><button class="btn ghost" id=gcp>Copy</button></div></div>

function lOp(l,d){d=Math.round((+d||0)*1000)/1000;if(!d)return;if(l.b==null)l.b=Math.round(((+l.q||0))*1000)/1000;l.ops=l.ops||[];l.ops.push(d);if(l.ops.length>200)l.ops=l.ops.slice(-200)}
function lFxTxt(l){const o=l.ops||[];if(!o.length)return '';const g=[];o.forEach(d=>{const x=g[g.length-1];if(x&&x.d===d)x.n++;else g.push({d,n:1})});return {b:+l.b||0,g}}
function lFx(l){const f=lFxTxt(l);if(!f)return '';return `<div class=qfx data-lq=${LST.lines.indexOf(l)}><button class=qsv data-lsv=${LST.lines.indexOf(l)}>✔ Save</button><span class=bs>${f2(f.b)}</span> ${f.g.map(x=>`<span class=${x.d>0?'pl':'mi'}>${x.d>0?'+':'−'}${f2(Math.abs(x.d))}${x.n>1?'×'+x.n:''}</span>`).join(' ')} = <b>${f2(+l.q||0)}</b></div>`}
function calcEval(t){const s=String(t).replace(/×/g,'*').replace(/−/g,'-').replace(/\s/g,'');if(!s)return 0;if(!/^[-+*0-9.]+$/.test(s))return NaN;const m=s.match(/[-+]?[0-9.]+(\*[0-9.]+)*/g);if(!m||m.join('')!==s.replace(/^\+/,''))return NaN;
 return Math.round(m.reduce((a,x)=>{const p=x.replace(/^[-+]/,'').split('*').reduce((u,v)=>u*(+v),1),sg=x[0]=='-'?-1:1;return a+sg*p},0)*1000)/1000}
function lCalc(l){if(!l)return;const f=lFxTxt(l),base=f?f.b:(+l.q||0);let ex=f?String(base)+(l.ops||[]).map(d=>(d>0?'+':'-')+Math.abs(d)).join(''):String(+l.q||0);
 const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div class="in calc"><b style="font-size:16px">${esc(l.n||l.nm||l.c)}</b>
  <div class=last><span>Last saved: <b>${f2(base)}</b></span><span>${(l.ops||[]).length?(l.ops.length+' change'+(l.ops.length>1?'s':'')+' since then'):'no change since save'}</span></div>
  <div class=disp><span id=cx></span><span class=res id=cr></span></div>
  <div class=kp>${['7','8','9','⌫','4','5','6','−','1','2','3','+','C','0','.','×'].map(k=>`<button data-k="${k}" class="${'+−×'.includes(k)?'op':k=='C'||k=='⌫'?'cl':''}">${k}</button>`).join('')}</div>
  <div style="height:8px"></div><button class="btn w" id=cok>Save</button><div style="height:6px"></div><button class="btn ghost w" id=cno>Cancel</button></div>`;document.body.appendChild(sh);
 const draw=()=>{const v=calcEval(ex.replace(/[-+*]$/,''));sh.querySelector('#cx').textContent=ex.replace(/\*/g,'×').replace(/-/g,'−')||'0';sh.querySelector('#cr').textContent=isNaN(v)?'?':'= '+f2(v);sh.querySelector('#cok').textContent=isNaN(v)?'Save':'Save  '+f2(Math.max(0,v))};draw();
 sh.querySelector('.kp').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k=='C')ex='';else if(k=='⌫')ex=ex.slice(0,-1);else{const c=k=='−'?'-':k=='×'?'*':k;if('+-*'.includes(c)&&(!ex||'+-*'.includes(ex.slice(-1))))ex=ex.replace(/[-+*]$/,'')+(ex?c:(c=='-'?'-':''));else ex+=c}try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}draw()};
 sh.querySelector('#cno').onclick=()=>sh.remove();
 sh.querySelector('#cok').onclick=()=>{const v=calcEval(ex.replace(/[-+*]$/,''));if(isNaN(v))return toast('Check the sum');const q=Math.max(0,v);l.q=q;l.b=q;l.ops=[];l.t=Date.now();lSave();lDraw();lStat();sh.remove();beep('ok');toast('Saved: '+f2(q))}}

/* ---- 📥 Stock aaya (28-Nov): photo of supplier bill / challan / parchi / stickers → Genie reads → check → Send to shop
   (WONDER › 📥 Phone Stock In → Admin Accept → filled Purchase). Draft stays on the phone until sent. ---- */
function siKey(){return 'wm_sin_'+U(ME&&ME.name||'')}function siGet(){return ls(siKey())||{supplier:'',bill_no:'',date:'',note:'',lines:[],photos:[]}}function siPut(d){ls(siKey(),d)}
function imgBig(f){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res('');im.src=r.result};r.readAsDataURL(f)})}
async function stockIn(){hb(1);$('#ttl').textContent='📥 Stock aaya';try{await loadItems()}catch(e){if(e.message!='stop')toast(e.message);return}const D=siGet();
 const tot=()=>D.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.pk||1),0);
 const row=(l,i)=>`<div class=sil data-i=${i}><div class=h><b class="${l.id?'':'nw'}">${l.id?'✔ '+esc(l.n):'⚠ '+esc(l.name||l.desc||'?')+' <small>(not in WONDER)</small>'}</b><button class=x data-x=${i}>✕</button></div>${l.desc&&l.desc!=l.n?`<div class=d>Read: ${esc(l.desc)}</div>`:''}
  <div class=g><div><label>Qty</label><input inputmode=decimal data-f=qty value="${l.qty||''}"></div><div><label>Unit</label><input data-f=unit value="${esc(l.unit||'')}"></div><div><label>× per unit</label><input inputmode=decimal data-f=pk value="${l.pk||1}"></div><div><label>Rate</label><input inputmode=decimal data-f=rate value="${l.rate||''}"></div></div>
  <span class=lnk data-ch=${i} style="font-size:13px">🔗 ${l.id?'change item':'choose item'}</span></div>`;
 const draw=()=>{$('#app').innerHTML=`<div class=card><div class=row><button class="btn" id=sip>📷 Photo se padho</button><button class="btn ghost" id=sia>＋ Add item</button></div><input type=file id=sif accept="image/*" capture=environment multiple style="display:none">
   <p class=note style="margin:8px 0 0">Bill, challan, parchi or roll stickers – Genie reads the items. Check everything, then send. Stock is added only when the shop accepts.</p></div>
  <div class=card><label class=l>Supplier</label><input id=sis value="${esc(D.supplier)}"><div class=row><div><label class=l>Bill / challan no.</label><input id=sib value="${esc(D.bill_no)}"></div><div><label class=l>Date</label><input id=sid value="${esc(D.date)}" placeholder="dd-mm-yyyy"></div></div>
   <div id=siw style="display:none;margin-top:8px"><input id=siq placeholder="Search item to add"><div id=sir></div></div></div>
  <div class=card style="padding:6px 12px"><b>Items (${D.lines.length}) · total ${f2(tot())}</b><div id=sil>${D.lines.map(row).join('')||'<p class=note>No items yet – take a photo or ＋ Add item.</p>'}</div>${D.photos.length?`<p class=note>📷 ${D.photos.length} photo(s) saved for the shop</p>`:''}</div>
  <div class=card><label class=l>Note (optional)</label><input id=sin value="${esc(D.note||'')}"><div style="height:10px"></div><button class="btn w" id=sis2>⬆ Send to shop</button><div style="height:6px"></div><button class="btn ghost w" id=siclr>Clear</button></div><div style="height:70px"></div>`;
  ['sis','sib','sid','sin'].forEach(id=>$('#'+id).oninput=e=>{D[{sis:'supplier',sib:'bill_no',sid:'date',sin:'note'}[id]]=e.target.value;siPut(D)});
  $('#sil').oninput=e=>{const f=e.target.dataset.f;if(!f)return;const i=+e.target.closest('.sil').dataset.i;D.lines[i][f]=f=='unit'?e.target.value:(+String(e.target.value).replace(',','.')||0);siPut(D)};
  $('#sil').onclick=e=>{const x=e.target.closest('[data-x]');if(x){D.lines.splice(+x.dataset.x,1);siPut(D);return draw()}const c=e.target.closest('[data-ch]');if(c){PICK=+c.dataset.ch;$('#siw').style.display='';$('#siq').focus();$('#siq').scrollIntoView({block:'center'})}};
  let PICK=-1;$('#sia').onclick=()=>{PICK=-1;const w=$('#siw');w.style.display=w.style.display=='none'?'':'none';if(w.style.display=='')$('#siq').focus()};
  $('#siq').oninput=()=>{const ws=U($('#siq').value).split(/\s+/).filter(Boolean),R=ws.length?ITEMS.filter(i=>ws.every(w=>U(i.n+' '+i.a+' '+i.g).includes(w))).slice(0,20):[];$('#sir').innerHTML=R.map(i=>`<div class=it data-ad=${i.id} style="cursor:pointer"><div class=nm><b>${esc(i.n)}</b><span>${esc([i.a,i.u].filter(Boolean).join(' · '))}</span></div><span class=ok>＋</span></div>`).join('')};
  $('#sir').onclick=e=>{const r=e.target.closest('[data-ad]');if(!r)return;const it=ITEMS.find(i=>i.id==r.dataset.ad);if(PICK>=0&&D.lines[PICK]){Object.assign(D.lines[PICK],{id:it.id,n:it.n});if(!D.lines[PICK].unit)D.lines[PICK].unit=it.u||''}else D.lines.push({id:it.id,n:it.n,qty:1,unit:it.u||'',pk:1,rate:0});siPut(D);draw()};
  $('#sip').onclick=()=>$('#sif').click();
  $('#sif').onchange=async e=>{const fs=[...e.target.files];if(!fs.length)return;const b=$('#sip');b.disabled=true;let n=0,ok=0;
   for(const f of fs){b.textContent='🤖 Reading '+(++n)+' / '+fs.length+'…';try{const img=await imgBig(f);if(!img)continue;const r=await call('mGenieStockIn',img);ok++;
     if(!D.supplier&&r.supplier)D.supplier=r.supplier;if(!D.bill_no&&r.bill_no)D.bill_no=r.bill_no;if(!D.date&&r.date)D.date=r.date;if(r.photo)D.photos.push(r.photo);
     (r.lines||[]).forEach(l=>D.lines.push({id:l.match?l.match.id:0,n:l.match?l.match.n:'',name:l.name||l.desc,desc:l.desc,qty:l.qty||0,unit:l.unit||(l.match&&l.match.u)||'',pk:1,rate:l.rate||0}));siPut(D)}
    catch(er){if(er.message=='stop')return;toast(er.message,3500)}}
   b.disabled=false;draw();if(ok)toast('🤖 Genie read '+ok+' photo(s) – please check the items',3000)};
  $('#siclr').onclick=async()=>{if(!await askBox('Clear this stock in?','All items and photos on this screen are removed (nothing was sent).','Clear',1))return;siPut(null);ls(siKey(),null);stockIn()};
  $('#sis2').onclick=async()=>{const L=D.lines.filter(l=>(+l.qty||0)>0);if(!L.length)return toast('Add at least one item with qty');const u=L.filter(l=>!l.id).length;
   if(!await askBox('Send to shop',`<b>${esc(D.supplier||'No supplier')}</b>${D.bill_no?' · bill '+esc(D.bill_no):''}<br>${L.length} items · total ${f2(L.reduce((a,l)=>a+(+l.qty||0)*(+l.pk||1),0))}${u?`<br><span style="color:#1d4ed8">${u} item(s) not in WONDER</span>`:''}`,'⬆ Send'))return;
   const b=$('#sis2');b.disabled=true;try{const r=await call('mStockIn',{supplier:D.supplier,bill_no:D.bill_no,date:D.date,note:D.note,photos:D.photos,lines:L.map(l=>({id:l.id||0,n:l.n||'',name:l.name||'',desc:l.desc||'',qty:Math.round((+l.qty||0)*(+l.pk||1)*1000)/1000,unit:(+l.pk||1)!=1?((ITEMS.find(i=>i.id==l.id)||{}).u||'')+(l.id?'':' ('+(+l.pk)+' per '+(l.unit||'unit')+')'):(l.unit||''),rate:(+l.pk||1)!=1&&(+l.rate||0)?Math.round((+l.rate)/(+l.pk)*100)/100:(+l.rate||0)}))});
    ls(siKey(),null);beep(1);doneBox('✔','Sent to the shop',esc(r.id)+'<br>'+L.length+' items – the shop will check and accept');stockIn()}catch(er){b.disabled=false;if(er.message!='stop')toast(er.message,3500)}}};
 draw()}

/* ---- same calculator on the shop's Stock count screen: first number = qty saved at the shop, then changes; Save = saved at once ---- */
function cFx(id){const o=COPS[id]||[],d=id in DIRTY;if(!o.length&&!d)return '';const b=SV[id]!=null?+SV[id]:0;const g=[];o.forEach(x=>{const y=g[g.length-1];if(y&&y.d===x)y.n++;else g.push({d:x,n:1})});
 return `<span class=qfx data-cq=${id} style="display:block;margin-top:4px;text-align:left"><button class=qsv data-csv=${id}>✔ Save</button><span class=bs>${f2(b)}</span> ${g.map(x=>`<span class=${x.d>0?'pl':'mi'}>${x.d>0?'+':'−'}${f2(Math.abs(x.d))}${x.n>1?'×'+x.n:''}</span>`).join(' ')}${!o.length?' → ':''} = <b>${f2(+Q[id]||0)}</b></span>`}
function cCalc(id){const it=IT.find(i=>i.id==id);if(!it)return;const base=SV[id]!=null?+SV[id]:0,ops=COPS[id]||[];let ex=ops.length?String(base)+ops.map(d=>(d>0?'+':'-')+Math.abs(d)).join(''):(Q[id]!=null?String(+Q[id]):'');
 const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div class="in calc"><b style="font-size:16px">${esc(it.n)}</b>
  <div class=last><span>Saved at shop: <b>${SV[id]!=null?f2(base):'–'}</b></span><span>${ops.length?ops.length+' change(s) since then':(id in DIRTY?'changed, not saved yet':'')}</span></div>
  <div class=disp><span id=cx></span><span class=res id=cr></span></div>
  <div class=kp>${['7','8','9','⌫','4','5','6','−','1','2','3','+','C','0','.','×'].map(k=>`<button data-k="${k}" class="${'+−×'.includes(k)?'op':k=='C'||k=='⌫'?'cl':''}">${k}</button>`).join('')}</div>
  <div style="height:8px"></div><button class="btn w" id=cok>Save</button><div style="height:6px"></div><button class="btn ghost w" id=cno>Cancel</button></div>`;document.body.appendChild(sh);
 const draw=()=>{const v=calcEval(ex.replace(/[-+*]$/,''));sh.querySelector('#cx').textContent=ex.replace(/\*/g,'×').replace(/-/g,'−')||'0';sh.querySelector('#cr').textContent=isNaN(v)?'?':'= '+f2(v);sh.querySelector('#cok').textContent=isNaN(v)?'Save':'Save  '+f2(Math.max(0,v))};draw();
 sh.querySelector('.kp').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;if(k=='C')ex='';else if(k=='⌫')ex=ex.slice(0,-1);else{const c=k=='−'?'-':k=='×'?'*':k;if('+-*'.includes(c)&&(!ex||'+-*'.includes(ex.slice(-1))))ex=ex.replace(/[-+*]$/,'')+(ex?c:(c=='-'?'-':''));else ex+=c}try{navigator.vibrate&&navigator.vibrate(8)}catch(_){}draw()};
 sh.querySelector('#cno').onclick=()=>sh.remove();
 sh.querySelector('#cok').onclick=()=>{const v=calcEval(ex.replace(/[-+*]$/,''));if(isNaN(v))return toast('Check the sum');const q=Math.max(0,v);Q[id]=q;DIRTY[id]=q;CLR.delete(String(id));delete COPS[id];RECENT=[+id,...RECENT.filter(x=>x!=id)];keep();sh.remove();drawList();status();beep('ok');save(false)}}

const P={};new URLSearchParams(location.search).forEach((v,k)=>P[k]=v);$('#sub').textContent=SHOP;run('mInfo').then(i=>{if(i&&i.shop){SHOP=i.shop;localStorage.setItem('wm_shop',SHOP);if(!ME)$('#sub').textContent=SHOP}}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(JOIN)history.replaceState(null,'',location.pathname);start(P);setTimeout(()=>upCheck(false),1500)
</script>
