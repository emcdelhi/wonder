<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f4c47">
<title>WONDER Mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f6f5;color:#1d2b2a;font-size:16px}
.top{background:#0f4c47;color:#fff;padding:12px 14px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}.top .t{flex:1}.top b{font-size:17px}.top .s{opacity:.85;font-size:13px;margin-top:2px}
.top button{background:#ffffff22;color:#fff;border:0;border-radius:8px;padding:8px 10px;font-size:14px}
.wrap{padding:12px;max-width:640px;margin:auto}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
input,textarea{font-size:17px;padding:11px 12px;border:1px solid #c9d6d3;border-radius:10px;width:100%;font-family:inherit}input:focus,textarea:focus{outline:2px solid #0f766e;border-color:#0f766e}
label.l{display:block;font-size:13px;color:#6b7c79;margin:10px 0 4px}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:#0f766e;color:#fff;cursor:pointer}.btn.ghost{background:#e3f3f1;color:#0f4c47}.btn.warn{background:#b5600f}.btn.w{width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row .btn{flex:0 0 auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{background:#fff;border-radius:14px;padding:16px 12px;box-shadow:0 1px 3px #0001;text-align:center;font-weight:600;cursor:pointer}.tile .i{font-size:30px}.tile .n{font-size:12px;color:#6b7c79;font-weight:400;margin-top:4px}
.it{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #eef2f1}.it .nm{flex:1;min-width:0}.it .nm b{display:block;font-size:15px;word-break:break-word}.it .nm span{font-size:12px;color:#6b7c79}
.it input{width:86px;flex:0 0 86px;text-align:right;padding:9px}.it.done input{background:#e9f7ee;border-color:#7cc59a}.it.dirty input{background:#fff7e6;border-color:#e0a84a}
.it .x{border:0;background:none;color:#b42318;font-size:20px;padding:4px 6px}
.note{font-size:13px;color:#6b7c79}.err{color:#b42318;font-weight:600;margin-top:8px}.ok{color:#0f766e;font-weight:600}.lnk{color:#0f766e;text-decoration:underline;cursor:pointer;font-size:14px}
.bar{position:sticky;bottom:0;background:#fff;padding:10px 12px;box-shadow:0 -2px 6px #0001;display:flex;gap:8px;align-items:center}.bar .st{flex:1;font-size:13px;color:#6b7c79}
.sheet{position:fixed;inset:0;background:#000c;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.sheet .in{background:#fff;border-radius:14px;padding:12px;width:100%;max-width:520px}
video{width:100%;border-radius:10px;background:#000;max-height:60vh}.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1d2b2a;color:#fff;padding:10px 16px;border-radius:20px;z-index:30;font-size:14px;max-width:90%}
.tabs{display:flex;gap:6px;margin:4px 0 8px}.tabs button{flex:1;border:0;border-radius:8px;padding:9px;background:#e9eeed;font-weight:600}.tabs button.on{background:#0f766e;color:#fff}
.pill{padding:3px 10px;border-radius:12px;font-size:13px;font-weight:600}.tot{font-size:18px;font-weight:700;text-align:right}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;height:36vh;margin-bottom:10px}.cam video{width:100%;height:100%;object-fit:cover;max-height:none;border-radius:0}
.cam .aim{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#ef4444cc;box-shadow:0 0 8px #ef4444}.cam .ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.cam .ctl button{border:0;border-radius:20px;background:#0009;color:#fff;padding:7px 12px;font-size:13px;font-weight:600}.cam .msg{position:absolute;left:8px;right:8px;bottom:8px;background:#000a;color:#fff;border-radius:10px;padding:7px 10px;font-size:14px;font-weight:600;min-height:20px}
.cam .msg.ok{background:#0f766ee6}.cam .msg.bad{background:#b42318e6}.camoff{display:flex;align-items:center;justify-content:center;color:#9ca3af;height:100%;font-size:14px}.it.flash{animation:fl 1.2s}@keyframes fl{0%{background:#bbf7d0}100%{background:transparent}}
.cam{height:40vh;margin:-12px -12px 10px;border-radius:0}.aimbox{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);border:3px solid #ffffffd9;border-radius:18px;box-shadow:0 0 0 2000px #0008;pointer-events:none}
.cb{position:absolute;border:0;background:#0007;color:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:2}.cb.tl{left:10px;top:10px}.cb.tr{right:10px;top:10px}.cb.mr{right:10px;top:44%;transform:translateY(-50%)}.cb.bl{left:10px;bottom:50px}.cb.on{background:#facc15;color:#000}
.sw{position:relative;display:inline-block;width:52px;height:30px;flex:0 0 52px}.sw input{opacity:0;width:0;height:0;position:absolute}.sw i{position:absolute;inset:0;background:#9ca3af;border-radius:20px;transition:.2s}.sw i:before{content:'';position:absolute;width:24px;height:24px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.sw input:checked+i{background:#6d28d9}.sw input:checked+i:before{transform:translateX(22px)}
.cam .sw.br{position:absolute;right:12px;bottom:54px;z-index:2}.cam .msg{z-index:2}
.scanpill{position:fixed;left:50%;transform:translateX(-50%);bottom:104px;z-index:9;background:#6d28d9;color:#fff;border:0;border-radius:30px;padding:14px 32px;font-size:17px;font-weight:700;box-shadow:0 4px 16px #6d28d977}.scanpill.on{background:#16a34a}
.tblh{display:flex;align-items:center;padding:8px 4px;border-bottom:2px solid #e5e7eb;font-weight:700}.tblh .add{color:#6d28d9;margin-left:auto;margin-right:10px;font-weight:600;cursor:pointer}.tblh .q{width:84px;text-align:center;border-left:1px solid #e5e7eb;line-height:1.1}
.tbl .it{padding:12px 4px}.tbl .it .nm b{font-size:18px;font-weight:800;letter-spacing:.2px}.tbl .it input{width:84px;flex:0 0 84px;border:0;border-left:1px solid #e5e7eb;border-radius:0;font-size:20px;font-weight:700;text-align:center;background:transparent;padding:6px}.tbl .it.dirty input{background:#fff7e6}.tbl .it.done input{background:transparent}.tbl .it .x{color:#c5c9d0;font-size:15px;padding:2px 6px 2px 0}
.lcard{background:#eceef2;border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}.lcard b{display:block;font-size:17px}.lcard .m{display:flex;justify-content:space-between;color:#555;font-size:13px;margin-top:4px}
.fab{position:fixed;right:18px;bottom:26px;background:#6d28d9;color:#fff;border:0;border-radius:30px;padding:15px 24px;font-size:17px;font-weight:700;box-shadow:0 4px 16px #6d28d977;z-index:9}
.srow{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #f0f0f0}.srow>div{flex:1}.srow b{display:block;font-size:15px}.srow span{font-size:12.5px;color:#6b7280}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px}.chips button{border:1px solid #d1d5db;background:#fff;border-radius:6px;padding:9px 14px;font-size:14px}.chips button.on{background:#6d28d9;color:#fff;border-color:#6d28d9}
.upd{position:fixed;top:0;left:0;right:0;background:#6d28d9;color:#fff;text-align:center;padding:10px;z-index:50;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class=top><div class=t><b id=ttl>WONDER Mobile</b><div class=s id=sub></div></div><button id=hb style="display:none">⌂</button></div>
<div class=wrap id=app></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzl13KzBGmSsTvoE_o-jtevudsTVAdV5VyKa6sNtb4WzulJ-iy4X30opOmxB0pW6Y7ApQ/exec';let SHOP=localStorage.getItem('wm_shop')||'';const JOIN=(new URLSearchParams(location.search).get('j')||'').replace(/[^A-Za-z0-9]/g,'').toUpperCase();let TOK='',ME=null,ITEMS=null,PARTIES=null,CT='',M=null,IT=[],Q={},DIRTY={},CLR=new Set(),TAB='list',busy=false,lastSave=0,QT=null;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),U=s=>String(s||'').trim().toUpperCase(),dmy=d=>String(d||'').split('-').reverse().join('-'),f2=n=>(Math.round((+n||0)*100)/100).toLocaleString('en-IN',{maximumFractionDigits:2});
function toast(t,ms){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2200)}
function ls(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(_){return null}}
async function run(fn,...a){let r;try{r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({mrun:fn,args:a})})}catch(e){throw new Error('No internet – try again')}let j;try{j=await r.json()}catch(e){throw new Error('Shop server did not answer – try again')}if(!j.ok)throw new Error(j.err||'Error');return j.res}
async function call(fn,...a){try{return await run(fn,TOK,...a)}catch(e){if(/log in again/i.test(e.message)){TOK='';ls('wm_tok',null);login(e.message);throw new Error('stop')}throw e}}
function hb(show){$('#hb').style.display=show?'':'none'}
/* back button = one screen back (Deepak 27-Nov) */
let NAVS=[];function nav(fn){camStop();NAVS.push(fn);history.pushState({n:NAVS.length},'');fn()}
async function leaving(){if(CT&&(Object.keys(DIRTY).length||CLR.size))await save(false)}
window.addEventListener('popstate',async()=>{await leaving();camStop();NAVS.pop();const f=NAVS[NAVS.length-1];if(f)f();else home(true)});
async function goHome(){await leaving();const n=NAVS.length;NAVS=[];if(n)history.go(-n);else home(true)}
$('#hb').onclick=()=>goHome();
/* ---------- login / PIN ---------- */
function login(msg,pre){hb(0);$('#ttl').textContent='WONDER Mobile';$('#sub').textContent=SHOP;const u=(pre&&pre.u)||ls('wm_user')||'';
 $('#app').innerHTML=`<div class=card><h3 style="margin-top:0">Log in</h3><label class=l>User name (same as WONDER)</label><input id=lu value="${esc(u)}" autocomplete=username autocapitalize=none>
  <label class=l>PIN</label><input id=lp type=password inputmode=numeric maxlength=6 placeholder="••••" autocomplete=current-password><div style="height:12px"></div>
  <button class="btn w" id=lgo>Log in</button><div class=err id=le>${esc(msg||'')}</div><div style="height:12px"></div><span class=lnk id=lfirst>First time / Forgot PIN →</span></div>
  <div class=card><p class=note style="margin:0">Tip: Chrome menu ⋮ → <b>Install app</b> (or Add to Home screen) – then WONDER Mobile opens like an app with its own icon.</p></div>`;
 const go=async()=>{const user=$('#lu').value.trim(),pin=$('#lp').value.trim();if(!user)return $('#le').textContent='Write your user name';if(!/^\d{4,6}$/.test(pin))return $('#le').textContent='PIN is 4–6 digits';
  $('#lgo').disabled=true;$('#le').textContent='';try{const r=await run('mLogin',user,pin);TOK=r.tok;ls('wm_tok',TOK);ls('wm_user',user);home()}catch(e){$('#lgo').disabled=false;$('#le').textContent=e.message}};
 $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key=='Enter')go()};$('#lfirst').onclick=()=>setPin('',{u:$('#lu').value.trim()});(u?$('#lp'):$('#lu')).focus()}
function setPin(msg,pre){hb(0);const u=(pre&&pre.u)||'',c=(pre&&pre.c)||'';
 $('#app').innerHTML=`<div class=card><h3 style="margin-top:0">Set your PIN</h3><p class=note>Use the <b>setup code</b> from the shop (it works once). Choose your own 4–6 digit PIN – nobody else sees it.</p>
  <label class=l>User name</label><input id=su value="${esc(u)}" autocapitalize=none><label class=l>Setup code</label><input id=sc value="${esc(c)}" autocapitalize=characters placeholder="e.g. K7M2QX">
  <label class=l>New PIN</label><input id=sp1 type=password inputmode=numeric maxlength=6><label class=l>New PIN again</label><input id=sp2 type=password inputmode=numeric maxlength=6>
  <div style="height:12px"></div><button class="btn w" id=sgo>Save PIN &amp; log in</button><div class=err id=se>${esc(msg||'')}</div>
  <div style="height:14px"></div><span class=lnk id=sask>No setup code? Ask the shop for one</span> &nbsp; <span class=lnk id=sback>← Back</span></div>`;
 $('#sgo').onclick=async()=>{const user=$('#su').value.trim(),code=$('#sc').value.trim(),p1=$('#sp1').value.trim(),p2=$('#sp2').value.trim();
  if(!user||!code)return $('#se').textContent='Write user name and setup code';if(!/^\d{4,6}$/.test(p1))return $('#se').textContent='PIN must be 4–6 digits';if(p1!==p2)return $('#se').textContent='The two PINs are not the same';
  $('#sgo').disabled=true;try{const r=await run('mSetPin',user,code,p1);TOK=r.tok;ls('wm_tok',TOK);ls('wm_user',user);toast('✔ PIN saved');home()}catch(e){$('#sgo').disabled=false;$('#se').textContent=e.message}};
 $('#sask').onclick=async()=>{const user=$('#su').value.trim();if(!user)return $('#se').textContent='Write your user name first';try{await run('mForgot',user);$('#se').innerHTML='<span class=ok>✔ Request sent – the shop will give you a new setup code.</span>'}catch(e){$('#se').textContent=e.message}};
 $('#sback').onclick=()=>login();}
/* ---------- home ---------- */
async function home(keep){camStop();if(!keep&&NAVS.length){NAVS=[]}CT='';M=null;QT=null;hb(0);$('#ttl').textContent='WONDER Mobile';$('#app').innerHTML='<div class=card><p class=note>Loading…</p></div>';
 try{ME=await call('mHome')}catch(e){if(e.message!='stop')$('#app').innerHTML='<div class=card><b class=err>'+esc(e.message)+'</b><div style="height:10px"></div><button class="btn ghost" onclick="home()">Try again</button></div>';return}
 $('#sub').textContent='Hello '+ME.name+' · '+SHOP;const F=ME.flags||{},open=ME.counts.filter(c=>c.status=='open').length,sent=(ls('wm_q_'+U(ME.name))||[]);
 $('#app').innerHTML=`<div class=tiles>${F.count?`<div class=tile id=tc><div class=i>📦</div>Stock count<div class=n>${open?open+' to count':'nothing to count'}</div></div>`:''}
  ${F.count?`<div class=tile id=tl><div class=i>📋</div>My scan lists<div class=n>${(ls('wm_lists_'+U(ME.name))||[]).length} on this phone</div></div>`:''}
  ${F.quote?`<div class=tile id=tq><div class=i>📝</div>New quotation<div class=n>${sent.length?sent.length+' sent':'send to the shop'}</div></div>`:''}
  <div class=tile id=ti><div class=i>🔍</div>Items<div class=n>${F.rate||F.stock?'rates'+(F.stock?' & stock':''):'name & code'}</div></div>
  <div class=tile id=tp><div class=i>🔑</div>Change PIN<div class=n>or log out</div></div></div>
  ${F.quote&&sent.length?`<div class=card style="margin-top:12px"><b>Quotations sent from this phone</b>${sent.slice(-10).reverse().map(q=>`<div class=it><div class=nm><b>${esc(q.party||q.phone)}</b><span>${esc(q.id)} · ${esc(q.at)} · ${q.n} items${q.t?' · ₹'+f2(q.t):''}</span></div></div>`).join('')}</div>`:''}
  ${ME.mc?`<div class=card style="margin-top:12px;background:#fff7e6;border:1px solid #e0a84a"><b>🔑 Your PIN is still 1234</b><p class=note style="margin:6px 0">Everybody knows 1234. Make your own PIN – takes 10 seconds.</p><button class="btn" id=mcp>Make my PIN</button></div>`:''}
  <div class=card style="margin-top:12px;display:flex;gap:8px;align-items:center"><span class=note style="flex:1">Version ${APP_V}</span><button class="btn ghost" id=hup>⟳ Update</button><button class="btn ghost" id=hset>⚙</button></div>
  ${!F.count&&!F.quote?'<p class=note style="margin-top:12px">The shop has not given you stock count or quotation yet.</p>':''}`;
 $('#hup').onclick=()=>upCheck(true);$('#hset').onclick=()=>nav(scanSettings);$('#tc')&&($('#tc').onclick=()=>nav(counts));$('#tl')&&($('#tl').onclick=()=>nav(lists));$('#tq')&&($('#tq').onclick=()=>nav(()=>quote()));$('#ti').onclick=()=>nav(items);$('#tp').onclick=()=>nav(pinMenu);$('#mcp')&&($('#mcp').onclick=()=>{nav(pinMenu);$('#o1').value='1234';$('#o2').focus()})}
async function loadItems(){if(ITEMS)return ITEMS;$('#app').innerHTML='<div class=card><p class=note>Loading items…</p></div>';ITEMS=await call('mItems');return ITEMS}
function pinMenu(){hb(1);$('#ttl').textContent='Change PIN';$('#app').innerHTML=`<div class=card><label class=l>Old PIN</label><input id=o1 type=password inputmode=numeric maxlength=6><label class=l>New PIN</label><input id=o2 type=password inputmode=numeric maxlength=6><label class=l>New PIN again</label><input id=o3 type=password inputmode=numeric maxlength=6>
 <div style="height:12px"></div><button class="btn w" id=ogo>Change PIN</button><div class=err id=oe></div></div><div class=card><button class="btn ghost w" id=lo>Log out from this phone</button></div>`;
 $('#ogo').onclick=async()=>{const a=$('#o1').value.trim(),b=$('#o2').value.trim();if(b!==$('#o3').value.trim())return $('#oe').textContent='The two new PINs are not the same';try{await call('mChangePin',a,b);toast('✔ PIN changed');home()}catch(e){if(e.message!='stop')$('#oe').textContent=e.message}};
 $('#lo').onclick=async()=>{try{await run('mLogout',TOK)}catch(_){}TOK='';ls('wm_tok',null);ITEMS=null;login('Logged out')}}
/* ---------- items lookup ---------- */
async function items(){hb(1);$('#ttl').textContent='Items';try{await loadItems()}catch(e){if(e.message!='stop')toast(e.message);return}const F=ME.flags||{};
 $('#app').innerHTML=`<div class=card><div class=row><input id=iq placeholder="Search name / code" autocomplete=off><button class="btn ghost" id=isc>📷</button></div><div id=il></div></div>`;
 const draw=()=>{const q=U($('#iq').value),ws=q.split(/\s+/).filter(Boolean),L=ws.length?ITEMS.filter(i=>ws.every(w=>U(i.n+' '+i.a+' '+i.g).includes(w))).slice(0,60):[];
  $('#il').innerHTML=L.map(i=>`<div class=it><div class=nm><b>${esc(i.n)}</b><span>${esc([i.a,i.u,i.g].filter(Boolean).join(' · '))}</span></div><div style="text-align:right;font-size:14px">${F.rate&&i.r>0?'₹'+f2(i.r):''}${F.rate&&i.m?'<div class=note>MRP '+f2(i.m)+'</div>':''}${F.stock&&i.s!=null?'<div class=note>Stock '+f2(i.s)+'</div>':''}${i.v!=null?'<div class=note>Value ₹'+f2(i.v)+'</div>':''}</div></div>`).join('')||`<p class=note>${q?'No item found':'Type a name or code, or scan.'}</p>`};
 $('#iq').oninput=draw;$('#isc').onclick=()=>camScan(t=>{const it=find(t);$('#iq').value=it?(it.a||it.n):t;draw()});draw();$('#iq').focus()}
function find(code){const c=U(code);return (ITEMS||IT).find(i=>U(i.a)==c)||(ITEMS||IT).find(i=>U(i.n)==c)}
/* ---------- quotation ---------- */
async function quote(){hb(1);$('#ttl').textContent='New quotation';try{await loadItems();if(!PARTIES)PARTIES=await call('mParties')}catch(e){if(e.message!='stop')toast(e.message);return}
 const F=ME.flags||{};QT=ls('wm_draft_'+U(ME.name))||{party:'',phone:'',note:'',lines:[]};
 $('#app').innerHTML=`<div class=card><label class=l>Party</label><input id=qp list=qpl value="${esc(QT.party)}" placeholder="Customer name" autocomplete=off><datalist id=qpl>${PARTIES.slice(0,3000).map(p=>`<option value="${esc(p.n)}">${esc(p.c||'')}</option>`).join('')}</datalist>
  <label class=l>Mobile (10 digits)</label><input id=qm inputmode=numeric maxlength=10 value="${esc(QT.phone)}"></div>
  <div class=card><div class=row><input id=qs placeholder="Add item: name / code" autocomplete=off><button class="btn ghost" id=qsc>📷</button></div><div id=qr></div><div id=ql></div><div class=tot id=qt></div>
  <label class=l>Note</label><input id=qn value="${esc(QT.note)}" placeholder="optional"></div>
  <div class=bar><div class=st id=qst>Draft is kept on this phone</div><button class="btn ghost" id=qclr>Clear</button><button class="btn" id=qgo>Send to shop</button></div>`;
 const keepQ=()=>{QT.party=$('#qp').value.trim();QT.phone=$('#qm').value.trim();QT.note=$('#qn').value.trim();ls('wm_draft_'+U(ME.name),QT)};
 const byId=id=>ITEMS.find(i=>i.id==id);
 const drawL=()=>{let t=0;$('#ql').innerHTML=QT.lines.map((l,k)=>{const it=byId(l.id)||{n:'?'};const amt=F.rate&&l.r!==''&&l.r!=null?(+l.q||0)*(+l.r||0):null;if(amt!=null)t+=amt;
   return`<div class=it><div class=nm><b>${esc(it.n)}</b><span>${esc([it.a,it.u].filter(Boolean).join(' · '))}${amt!=null?' · ₹'+f2(amt):''}</span></div><input data-k=${k} data-f=q inputmode=decimal value="${esc(l.q)}" placeholder="qty">${F.rate?`<input data-k=${k} data-f=r inputmode=decimal value="${esc(l.r==null?'':l.r)}" placeholder="rate">`:''}<button class=x data-x=${k}>✕</button></div>`}).join('')||'<p class=note>No items yet.</p>';
  $('#qt').textContent=F.rate&&QT.lines.length?'Total ₹'+f2(t):'';QT.t=F.rate?t:0};

 const q=Math.round(((+Q[it.id]||0)+add)*1000)/1000;Q[it.id]=q;DIRTY[it.id]=q;CLR.delete(String(it.id));keep();beep(1);RECENT=[it.id,...RECENT.filter(x=>x!=it.id)];msg('✔ '+it.n+'  =  '+q,'ok');
 if($('#sq').value)$('#sq').value='';TAB='done';drawList();const r=document.querySelector('.it[data-id="'+it.id+'"]');if(r){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}}
/* ---------- My scan lists (like Barcodica): new list on the phone, scan = +1, save, share, upload to the shop ---------- */
function LK(){return 'wm_lists_'+U(ME.name)}function lGet(){return ls(LK())||[]}function lPut(L){ls(LK(),L)}
async function lists(){hb(1);$('#ttl').textContent='📋 My scan lists';const L=lGet().sort((a,b)=>String(b.at).localeCompare(String(a.at)));
 $('#app').innerHTML=`${L.map(x=>{const q=x.lines.reduce((s,l)=>s+(+l.q||0),0);return`<div class=lcard data-l="${x.id}"><b>${esc(x.name)}${x.up?' <span class=pill style="color:#0f766e;background:#d7f0ec;font-size:11px">Sent ✓</span>':''}</b><div class=m><span>Barcodes: ${x.lines.length} <small>(Qty: ${f2(q)})</small></span><span>${esc(x.at)}</span></div></div>`}).join('')||'<div class=card><p class=note style="margin:0">No list yet. Tap <b>NEW</b>, then scan items – every scan adds 1.</p></div>'}<div style="height:70px"></div><button class=fab id=lnew>⊞ NEW</button>`;
 $('#lnew').onclick=()=>{const d=new Date(),nm=prompt('Name of the list (e.g. Rack 3, Godown shelf A)',d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false}));if(nm==null)return;
  const x={id:'L'+Date.now().toString(36),name:nm.trim()||'List',at:d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}),lines:[]};const A=lGet();A.push(x);lPut(A);nav(()=>listOpen(x.id))};
 document.querySelectorAll('[data-l]').forEach(r=>r.onclick=()=>nav(()=>listOpen(r.dataset.l)))}
let LST=null,LREC=[];
async function listOpen(id){hb(1);try{await loadItems()}catch(e){if(e.message!='stop')toast(e.message);return}const A=lGet();LST=A.find(x=>x.id==id);if(!LST)return lists();LREC=[];
 $('#ttl').textContent='📋 '+LST.name;
 $('#app').innerHTML=`${camPanel()}<div class="card tbl" style="padding:6px 8px"><div class=tblh><span>Item <small class=note id=lhn></small></span><span class=add id=ladd>＋ Add</span><span class=q>Qty<br><small class=note id=lhq></small></span></div><div id=lqw style="display:none;padding:8px 0"><input id=lq placeholder="Search name / code to add" autocomplete=off></div><div id=lr></div><div id=ll></div></div>
  <div class=bar><div class=st id=lst2></div><button class="btn ghost" id=lsh>Share</button><button class="btn" id=lup>Send to shop</button></div>
  <div class=card><button class="btn ghost w" id=ldel style="color:#b42318">Delete this list</button></div>`;
 camWire(listHit,()=>listOpen(id));$('#ladd').onclick=()=>{const w=$('#lqw');w.style.display=w.style.display=='none'?'':'none';if(w.style.display=='')$('#lq').focus()};
 $('#lq').oninput=()=>{const ws=U($('#lq').value).split(/\s+/).filter(Boolean),R=ws.length?ITEMS.filter(i=>ws.every(w=>U(i.n+' '+i.a+' '+i.g).includes(w))).slice(0,20):[];$('#lr').innerHTML=R.map(i=>`<div class=it data-ad=${i.id} style="cursor:pointer"><div class=nm><b>${esc(i.n)}</b><span>${esc([i.a,i.u].filter(Boolean).join(' · '))}</span></div><span class=ok>＋</span></div>`).join('')};
 $('#lr').onclick=e=>{const r=e.target.closest('[data-ad]');if(!r)return;const it=ITEMS.find(i=>i.id==r.dataset.ad);lAdd(it.a||it.n,it,1);$('#lq').value='';$('#lr').innerHTML=''};
 $('#ll').addEventListener('input',e=>{const x=e.target.closest('[data-lq]');if(!x)return;const l=LST.lines[+x.dataset.lq];l.q=x.value.trim()===''?0:+x.value||0;lSave(1)});
 $('#ll').onclick=e=>{const b=e.target.closest('[data-lx]');if(b&&confirm('Remove this line?')){LST.lines.splice(+b.dataset.lx,1);lSave();lDraw()}};
 $('#lsh').onclick=lShare;$('#lup').onclick=lUpload;$('#ldel').onclick=()=>{if(!confirm('Delete list "'+LST.name+'" from this phone?'))return;lPut(lGet().filter(x=>x.id!=LST.id));history.back()};lDraw()}
function lSave(quiet){const A=lGet(),i=A.findIndex(x=>x.id==LST.id);LST.up=false;if(i>=0)A[i]=LST;lPut(A);if(!quiet)lStat()}
function lStat(){const q=LST.lines.reduce((s,l)=>s+(+l.q||0),0);$('#lhn')&&($('#lhn').textContent='('+LST.lines.length+')');$('#lhq')&&($('#lhq').textContent=f2(q));$('#lst2')&&($('#lst2').textContent=LST.lines.length+' items · qty '+f2(q)+(LST.up?' · sent ✓':' · saved on phone'))}
function lDraw(){const k=x=>{const i=LREC.indexOf(LST.lines[x.i]);return i<0?1e9:i};const L=LST.lines.map((l,i)=>({...l,i})).sort((a,b)=>k(a)-k(b));
 $('#ll').innerHTML=L.map(l=>`<div class=it data-li="${l.i}"><button class=x data-lx=${l.i}>✕</button><div class=nm><b>${esc(l.c)}</b><span>${l.id?esc(l.n):'❓ not in WONDER'}</span></div><input inputmode=decimal data-lq=${l.i} value="${l.q}"></div>`).join('')||'<p class=note style="padding:10px">Scan an item – every scan adds 1.</p>';lStat()}
function lAdd(code,it,add,sep){const c=String(code).trim();let l=sep?null:LST.lines.find(x=>U(x.c)==U(c)||(it&&x.id==it.id));if(!l){l={c,id:it?it.id:0,n:it?it.n:'',q:0};LST.lines.push(l)}l.q=Math.round(((+l.q||0)+add)*1000)/1000;LREC=[l,...LREC.filter(x=>x!=l)];lSave(1);lDraw();
 const r=document.querySelector('[data-li="'+LST.lines.indexOf(l)+'"]');if(r){r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}return l}
function listHit(code,msg){const it=find(code),key=it?(it.a||it.n):code,ex=LST.lines.find(x=>U(x.c)==U(key)||(it&&x.id==it.id));if(SET.prohibit&&ex){beep(0);return msg('⛔ Already in this list: '+(it?it.n:code),'bad')}
 const add=askQ(it?it.n:code);if(add==null)return msg('Skipped');const l=lAdd(key,it,add,!SET.combine);beep(!!it);msg((it?'✔ ':'❓ ')+(it?it.n:code+' (not in WONDER)')+'  =  '+l.q,it?'ok':'bad')}
function lText(){return LST.name+' – '+ME.name+' ('+SHOP+')\n'+LST.lines.map(l=>(l.n||l.c)+(l.n?' ['+l.c+']':'')+' : '+l.q).join('\n')+'\nTotal items '+LST.lines.length}
async function lShare(){if(!LST.lines.length)return toast('List is empty');const t=lText(),csv='Code,Item,Qty\n'+LST.lines.map(l=>[l.c,l.n||'',l.q].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
 try{const f=new File([csv],LST.name.replace(/[^A-Za-z0-9 _-]/g,'_')+'.csv',{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]}))return await navigator.share({files:[f],text:t,title:LST.name});if(navigator.share)return await navigator.share({text:t,title:LST.name})}catch(e){if(e.name=='AbortError')return}
 try{await navigator.clipboard.writeText(t);toast('Copied – paste in WhatsApp')}catch(_){alert(t)}}
async function lUpload(){if(!LST.lines.length)return toast('List is empty');if(!confirm('Send "'+LST.name+'" ('+LST.lines.length+' items) to the shop?\nThe shop checks it in WONDER.'))return;$('#lup').disabled=true;
 try{await leaving();const r=await call('mUpList',{id:LST.id,name:LST.name,lines:LST.lines.map(l=>({c:l.c,id:l.id||0,q:+l.q||0}))});LST.up=true;const A=lGet(),i=A.findIndex(x=>x.id==LST.id);if(i>=0)A[i]=LST;lPut(A);lStat();toast('✔ Sent to the shop',2500)}
 catch(e){if(e.message!='stop')toast(e.message,3000)}finally{$('#lup')&&($('#lup').disabled=false)}}
/* ---------- start: setup link (?app=1&u=NAME&c=CODE) or saved login ---------- */
async function joinCode(j){setPin('',{c:j});const su=$('#su');su.placeholder='checking the link…';try{const n=await run('mCodeUser',j);su.value=n;su.readOnly=true;$('#sp1').focus()}catch(e){login(e.message)}}
function start(p){p=p||{};TOK=ls('wm_tok')||'';if(TOK)return home();const j=JOIN||p.j;if(j)return joinCode(j);if(p.k&&p.u)return setPin('',{u:p.u,c:p.k});login()}
const P={};new URLSearchParams(location.search).forEach((v,k)=>P[k]=v);$('#sub').textContent=SHOP;run('mInfo').then(i=>{if(i&&i.shop){SHOP=i.shop;localStorage.setItem('wm_shop',SHOP);if(!ME)$('#sub').textContent=SHOP}}).catch(()=>{});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(JOIN)history.replaceState(null,'',location.pathname);start(P);setTimeout(()=>upCheck(false),1500)
</script>
